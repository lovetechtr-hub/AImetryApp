kotlin.code.style=official
android.useAndroidX=true
kotlin.mpp.stability.nowarn=true


# Память для Gradle и Kotlin: без этого сборка (особенно iOS-фреймворка) падает
# с "JVM garbage collector is thrashing" и оставляет java_pid*.hprof в корне
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build/ -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.caching=true
