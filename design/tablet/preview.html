<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
<script>window.DJ={"top": [{"n": "David Guetta", "i": "https://i.scdn.co/image/ab67616100005174f150017ca69c8793503c2d4f", "s": 53.16, "p": 1, "c": null, "g": "edm"}, {"n": "Calvin Harris", "i": "https://i.scdn.co/image/ab676161000051748ebba5e60113b48de8c11f6b", "s": 51.46, "p": 2, "c": null, "g": "edm"}, {"n": "Tiësto", "i": "https://i.scdn.co/image/ab67616100005174f4973f7346a2f35e56b63d57", "s": 48.72, "p": 3, "c": null, "g": "edm"}, {"n": "Martin Garrix", "i": "https://i.scdn.co/image/ab67616100005174f5b8ee60f1f4ee3453aba40b", "s": 48.32, "p": 4, "c": null, "g": "edm"}, {"n": "Alok", "i": "https://i.scdn.co/image/ab676161000051746b07a040a57d013a7e49f908", "s": 48.27, "p": 5, "c": null, "g": "brazilian bass"}, {"n": "Fred again..", "i": "https://i.scdn.co/image/ab67616100005174f760292919aee89e58d943d9", "s": 48.07, "p": 6, "c": null, "g": "stutter house"}, {"n": "Marshmello", "i": "https://i.scdn.co/image/ab67616100005174fa62d7b4d09a4ea9b4c5f05d", "s": 47.61, "p": 7, "c": "up", "g": "edm"}, {"n": "Zedd", "i": "https://i.scdn.co/image/ab67616100005174eefa05f0b8fcafd4beb19d31", "s": 47.45, "p": 8, "c": "down", "g": "edm"}, {"n": "FISHER", "i": "https://i.scdn.co/image/ab6761610000517447847d97516d0e40b01eea5f", "s": 47.35, "p": 9, "c": null, "g": "tech house"}, {"n": "Swedish House Mafia", "i": "https://i.scdn.co/image/ab676161000051749614fcf985ad6fc5b4a7c3de", "s": 47.29, "p": 10, "c": "up", "g": "edm"}], "grow": [{"n": "Reinier Zonneveld", "i": "https://i.scdn.co/image/ab67616100005174bd9daa643e753aab5489f490", "s": 33, "d": 6.45, "g": "techno"}, {"n": "Mochakk", "i": "https://i.scdn.co/image/ab6761610000517425eb7fae06eeb3765c8832c0", "s": 33, "d": 6.18, "g": "tech house"}, {"n": "Carl Cox", "i": "https://i.scdn.co/image/ab67616100005174edb3ce2bc522e2abbf098083", "s": 33, "d": 6.08, "g": "techno"}, {"n": "Paul van Dyk", "i": "https://i.scdn.co/image/ab67616100005174f6a2ae0e81e8a35f2b29a14d", "s": 33, "d": 6.05, "g": "trance"}, {"n": "Lucas & Steve", "i": "https://i.scdn.co/image/ab67616100005174260048f788daa5c85ffee4d3", "s": 33, "d": 6.04, "g": "future house"}, {"n": "Nora En Pure", "i": "https://i.scdn.co/image/ab676161000051742d6db1d82461593938beef62", "s": 33, "d": 6, "g": "deep house"}, {"n": "Sara Landry", "i": "https://i.scdn.co/image/ab676161000051748adbcfbfe14ed883e93896c8", "s": 33, "d": 5.74, "g": "hard techno"}, {"n": "Bassjackers", "i": "https://i.scdn.co/image/ab676161000051745e1bdd182fbd98a3dc841d38", "s": 33, "d": 5.61, "g": "big room"}, {"n": "Korolova", "i": "https://i.scdn.co/image/ab67616100005174d2fa626e9afb8a8047255ea4", "s": 33, "d": 5.43, "g": "melodic techno"}, {"n": "Ferry Corsten", "i": "https://i.scdn.co/image/ab6761610000517446de5d8079d01cc1f8b22ced", "s": 33, "d": 5.32, "g": "trance"}]};</script>
<style>
:root{--bg:#0B1220;--p:#121B2C;--p2:#0E1728;--line:#1F2D45;--g:#5EE6A8;--t:#E6EEFC;--m:#9AB0D5;--o:#FFB35B;--r:#FF6B6B}
*{box-sizing:border-box}body{margin:0;background:#07090f;font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--t);padding:24px}
.wrap{display:flex;flex-direction:column;gap:30px;align-items:center}
.lbl{color:var(--m);font-size:14px;margin-top:10px;text-align:center}.lbl b{color:var(--t)}
.pad{border:12px solid #1b1d23;border-radius:38px;background:var(--bg);position:relative;overflow:hidden}
.land{width:1180px;height:820px}.port{width:820px;height:1180px}
.m{color:var(--m)}.g{color:var(--g)}
.cv{position:relative;border-radius:14px;overflow:hidden;background:#1A2740;border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 22px -10px rgba(0,0,0,.85);flex:none}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.22),transparent 38%,transparent 60%,rgba(0,0,0,.3))}
.rail{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:76px;padding:14px 0;border-radius:38px;background:rgba(18,27,44,.96);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;gap:22px;box-shadow:0 20px 40px -10px rgba(0,0,0,.8)}
.rail i{font-size:26px;color:#6F84A8}.rail .hash{width:58px;height:58px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px -4px rgba(94,230,168,.55)}
.chip{font-size:13px;padding:8px 14px;border-radius:20px;background:var(--p);border:1px solid rgba(255,255,255,.07);color:var(--m);white-space:nowrap}.chip.on{background:var(--g);color:var(--bg);font-weight:600}
.seg{display:flex;background:var(--p);border-radius:14px;padding:4px;font-size:13px}.seg span{padding:8px 16px;border-radius:11px;color:var(--m)}.seg .on{background:var(--g);color:var(--bg);font-weight:600}
.card{position:absolute;inset:0;border-radius:32px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.95)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.btn{border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--p);border:1px solid var(--line)}
.panel{background:var(--p);border:1px solid rgba(255,255,255,.07);border-radius:24px;padding:16px}
.row{display:flex;align-items:center;gap:12px}.nw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.h{font-size:15px;font-weight:650;margin-bottom:12px;display:flex;justify-content:space-between}.h span{font-size:12px;color:var(--g);font-weight:500}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="hx" viewBox="55 80 480 435"><path fill="currentColor" fill-rule="evenodd" d="M442.383 269.261L430.918 335.892L498.746 338.906L502.601 425.638L416.425 421.808L401.908 507.168L312.953 503.215L327.47 417.854L234.622 413.728L220.105 499.088L131.705 495.159L146.223 409.799L65.0505 406.191L61.1958 319.46L160.715 323.883L172.18 257.252L93.2322 253.744L89.3774 167.012L187.229 171.361L201.264 87.6437L289.664 91.5725L275.628 175.29L368.476 179.416L382.511 95.6991L471.467 99.6527L457.431 183.37L526.928 186.459L530.783 273.19L442.383 269.261ZM353.428 265.308L260.58 261.181L249.115 327.812L341.962 331.938L353.428 265.308Z"/></symbol></defs></svg>
<div class="wrap">
 <div><div class="pad land" id="L"></div><div class="lbl"><b>iPad · альбом</b> — навигация слева, колода по центру, справа «Растут сейчас», голоса и TOP 10</div></div>
 <div><div class="pad port" id="P"></div><div class="lbl"><b>iPad · портрет</b> — колода крупнее, под ней полки «Растут сейчас» и «Ваши голоса»</div></div>
</div>
<script>
const D=window.DJ, T=D.top, G=D.grow;
const cv=(s,w,h,r=14)=>`<div class="cv" style="width:${w}px;height:${h}px;border-radius:${r}px"><img src="${s}"></div>`;
const f2=x=>(+x).toFixed(2);
const rail=`<div class="rail"><i class="ti ti-trophy"></i><i class="ti ti-radar-2"></i><div class="hash"><svg width="28" height="25" style="color:#0B1220"><use href="#hx"/></svg></div><i class="ti ti-calendar-event"></i><i class="ti ti-user"></i></div>`;
const header=(w)=>`<div class="row" style="justify-content:space-between;width:${w}px"><div><div class="m" style="font-size:13px">Открытия</div><div style="font-size:30px;font-weight:750;letter-spacing:-.5px">Растут сейчас</div></div>
 <div class="seg"><span class="on">Открытия</span><span>Подписки</span></div>
 <div style="width:44px;height:44px;border-radius:14px;background:var(--p);display:flex;align-items:center;justify-content:center"><i class="ti ti-search" style="font-size:21px"></i></div></div>
 <div class="row" style="gap:8px;margin-top:16px"><span class="chip on">Растут</span><span class="chip">Прорывы</span><span class="chip">Стабильные</span><span class="chip">TOP 100</span><span class="chip">Techno</span><span class="chip">House</span></div>`;
function deck(w,h){const a=G[0];return `<div style="position:relative;width:${w}px;height:${h}px;margin-top:22px">
 <div class="card" style="transform:translateY(28px) scale(.9);opacity:.55"><img src="${G[2].i}"></div>
 <div class="card" style="transform:translateY(14px) scale(.95);opacity:.8"><img src="${G[1].i}"></div>
 <div class="card" style="transform:rotate(-4deg) translateX(-18px)"><img src="${a.i}">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(11,18,32,.97))"></div>
  <div style="position:absolute;top:26px;left:24px;padding:6px 14px;border:3px solid #5EE6A8;color:#5EE6A8;border-radius:12px;font-weight:900;font-size:26px;transform:rotate(-14deg)">СЛЕДИТЬ</div>
  <div style="position:absolute;left:26px;right:26px;bottom:26px">
   <div class="row" style="gap:8px"><span style="font-size:12.5px;padding:5px 10px;border-radius:10px;background:rgba(94,230,168,.18);color:#5EE6A8;font-weight:600"><i class="ti ti-trending-up"></i> +${f2(a.d)} за 7 дней</span><span style="font-size:12.5px;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.12)">${a.g}</span></div>
   <div style="font-size:42px;font-weight:780;letter-spacing:-.8px;margin-top:12px">${a.n}</div>
   <div class="row" style="margin-top:14px"><svg width="56" height="56" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" fill="none" stroke="#1F2D45" stroke-width="3"/><circle cx="18" cy="18" r="15.9" fill="none" stroke="#5EE6A8" stroke-width="3" stroke-linecap="round" stroke-dasharray="${a.s} 100" transform="rotate(-90 18 18)"/><text x="18" y="21.5" text-anchor="middle" font-size="10" font-weight="700" fill="#E6EEFC">${Math.round(a.s)}</text></svg>
   <div><div style="font-weight:600">DJMetry Score</div><div class="m" style="font-size:13px">стриминг · соцсети · голоса</div></div></div></div></div></div>`}
const actions=`<div class="row" style="justify-content:center;gap:26px;margin-top:26px">
 <div class="btn" style="width:66px;height:66px"><i class="ti ti-x" style="font-size:28px;color:var(--r)"></i></div>
 <div class="btn" style="width:66px;height:66px"><i class="ti ti-arrow-big-up-lines" style="font-size:28px;color:var(--o)"></i></div>
 <div class="btn" style="width:76px;height:76px;background:var(--g);border:0;box-shadow:0 12px 28px -6px rgba(94,230,168,.55)"><i class="ti ti-heart" style="font-size:32px;color:var(--bg)"></i></div></div>
 <div class="m" style="text-align:center;font-size:12.5px;margin-top:12px">← мимо · ↑ голос · следить → · или стрелки ← ↑ → на клавиатуре</div>`;
const votes=`<div class="panel"><div class="h">Ваши голоса <span>2 из 3</span></div>
 ${[T[4],T[8]].map(a=>`<div class="row" style="margin-bottom:10px">${cv(a.i,40,40,11)}<div class="nw" style="flex:1;font-size:14px;font-weight:600">${a.n}</div><i class="ti ti-arrow-big-up-lines-filled" style="color:var(--o)"></i></div>`).join("")}
 <div class="row" style="border:1.5px dashed #2C3D5C;border-radius:12px;padding:10px;justify-content:center;color:var(--m);font-size:13px"><i class="ti ti-plus"></i> Свайпните вверх, чтобы отдать голос</div></div>`;
const rising=(n)=>`<div class="panel"><div class="h">Следующие в колоде <span>Все</span></div>
 ${G.slice(1,1+n).map(a=>`<div class="row" style="margin-bottom:10px">${cv(a.i,44,44,12)}<div style="flex:1;min-width:0"><div class="nw" style="font-size:14px;font-weight:600">${a.n}</div><div class="m nw" style="font-size:12px">${a.g}</div></div><span class="g" style="font-size:13px;font-weight:600">+${f2(a.d)}</span></div>`).join("")}</div>`;
const topPanel=(n)=>`<div class="panel"><div class="h">DJMetry TOP 10 <span>TOP 100</span></div>
 ${T.slice(0,n).map(a=>`<div class="row" style="margin-bottom:9px"><span style="width:18px;font-size:13px" class="${a.p<=3?"g":"m"}">${a.p}</span>${cv(a.i,34,34,10)}<div class="nw" style="flex:1;font-size:13.5px">${a.n}</div><span style="font-size:13px;font-weight:600">${f2(a.s)}</span></div>`).join("")}</div>`;

L.innerHTML=`<div style="position:absolute;inset:0;padding:30px 30px 30px 128px;display:flex;gap:30px">
 <div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center">${header(560)}${deck(470,500)}${actions}</div>
 <div style="width:330px;display:flex;flex-direction:column;gap:16px">${votes}${rising(3)}${topPanel(5)}</div></div>${rail}`;

P.innerHTML=`<div style="position:absolute;inset:0;padding:36px 36px 36px 124px;display:flex;flex-direction:column;align-items:center">
 ${header(640)}${deck(560,640)}${actions}
 <div class="row" style="gap:16px;margin-top:28px;width:640px;align-items:stretch"><div style="flex:1">${votes}</div><div style="flex:1">${rising(3)}</div></div></div>${rail}`;
</script></body></html>
