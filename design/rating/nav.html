<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>DJMetry — навигация рейтингов</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
<style>
:root{--bg:#0B1220;--p:#121B2C;--p2:#0E1728;--line:#1F2D45;--g:#5EE6A8;--g2:#10302A;--t:#E6EEFC;--m:#9AB0D5;--o:#FFB35B;--r:#FF6B6B;--b:#7DA7FF}
*{box-sizing:border-box}body{margin:0;background:#07090f;font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--t);padding:22px}
h2{font-size:22px;margin:34px 0 4px}.sub{color:var(--m);font-size:14px;margin-bottom:14px}
.row{display:flex;gap:26px;align-items:flex-start}
.dev{position:relative;flex:none}.dev .lbl{color:var(--m);font-size:12.5px;margin-top:8px;text-align:center}
.frame{background:var(--bg);overflow:hidden;position:relative;transform-origin:top left}
.phone{width:390px;height:844px;border-radius:52px;border:10px solid #1b1d23}
.tab{width:1180px;height:820px;border-radius:40px;border:14px solid #1b1d23}
.desk{width:1440px;height:900px;border-radius:14px;border:1px solid #2a2d35}
.bar{height:34px;background:#1a1d24;display:flex;align-items:center;gap:8px;padding:0 14px}.bar i{width:12px;height:12px;border-radius:50%;display:inline-block}
.m{color:var(--m)}.g{color:var(--g)}.o{color:var(--o)}
.cv{position:relative;flex:none;overflow:hidden;background:#1A2740;border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 26px -12px rgba(0,0,0,.85)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.22),transparent 38%,transparent 60%,rgba(0,0,0,.3))}
.card{background:var(--p);border:1px solid rgba(255,255,255,.07);border-radius:22px;padding:16px}
.h{display:flex;justify-content:space-between;align-items:center;font-weight:650;font-size:15px;margin-bottom:12px}.h span{font-size:12.5px;color:var(--g);font-weight:500}
.metric{background:var(--p2);border-radius:16px;padding:12px}.metric b{display:block;font-size:22px}.metric small{color:var(--m);font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;height:50px;font-weight:650;font-size:15px}
.btn.pri{background:var(--g);color:var(--bg)}.btn.sec{background:var(--p);border:1px solid var(--line);color:var(--t)}
.tile{background:var(--p);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tile i{font-size:24px;color:var(--g)}.tile b{font-size:14.5px}.tile small{color:var(--m);font-size:12px}
.pill{position:absolute;left:18px;right:18px;bottom:26px;height:68px;border-radius:34px;background:rgba(18,27,44,.96);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-evenly}
.rail{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:76px;padding:14px 0;border-radius:38px;background:rgba(18,27,44,.96);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;gap:20px}
.pill i,.rail i{font-size:26px;color:#6F84A8}.pill .on,.rail .on{color:var(--g)}
.hash{width:56px;height:56px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:900;font-size:30px}
.badge{background:var(--r);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.st{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:8px 0;border-top:1px solid rgba(255,255,255,.05)}
.chip{font-size:12px;padding:6px 11px;border-radius:14px;background:var(--p2);color:var(--m)}
.spark{height:70px;width:100%}
.seg{display:flex;gap:6px}.seg span{padding:8px 14px;border-radius:12px;background:var(--p);color:var(--m);font-size:13.5px}.seg .on{background:var(--g);color:var(--bg);font-weight:650}
.navlist div{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-size:14.5px;color:var(--m)}.navlist div i{font-size:20px}.navlist .on{background:var(--p);color:var(--t)}.navlist .on i{color:var(--g)}
</style></head><body>
<div id="root"></div>
<script>
const I="https://i.scdn.co/image/";
const R=[[1,"David Guetta","ab6761610000e5ebf150017ca69c8793503c2d4f",53.16,"edm",0],[2,"Calvin Harris","ab6761610000e5eb8ebba5e60113b48de8c11f6b",51.46,"edm",0],[3,"Tiësto","ab6761610000e5ebf4973f7346a2f35e56b63d57",48.72,"edm",0],[4,"Martin Garrix","ab6761610000e5ebf5b8ee60f1f4ee3453aba40b",48.32,"edm",0],[5,"Alok","ab6761610000e5eb6b07a040a57d013a7e49f908",48.27,"brazilian bass",0],[6,"Kaskade","ab6761610000e5ebe753ae706df5e8a8da8497cc",33.29,"edm",2],[7,"Porter Robinson","ab6761610000e5ebf67786cf70976b5d87b27b5a",33.14,"edm",3],[8,"Martin Solveig","ab6761610000e5eb7520cf8cf5c0395d388ce696",33.10,"french house",0]];
const cv=(s,w,r=12)=>`<div class="cv" style="width:${w}px;height:${w}px;border-radius:${r}px;flex:none"><img src="${I+s}"></div>`;
const ch=d=>d>0?`<span style="color:var(--g);font-size:10.5px;font-weight:700">▲${d}</span>`:`<span class="m" style="font-size:10.5px">—</span>`;
const row=(r,n)=>`<div style="display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:16px;background:var(--p)"><div style="width:32px;text-align:right;flex:none"><b style="font-size:15px">${n??r[0]}</b><div>${ch(r[5])}</div></div>${cv(r[2],44,12)}<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r[1]}</div><div class="m" style="font-size:12px">${r[4]}</div></div><b style="font-size:15.5px">${r[3].toFixed(2)}</b></div>`;
const rows=(n=5,off=0)=>R.slice(off,off+n).map(r=>row(r)).join("");
const pill=`<div class="pill"><i class="ti ti-trophy on"></i><i class="ti ti-radar-2"></i><div class="hash">#</div><i class="ti ti-calendar-event"></i><i class="ti ti-user"></i></div>`;
const rail=`<div class="rail"><i class="ti ti-trophy on"></i><i class="ti ti-radar-2"></i><div class="hash">#</div><i class="ti ti-calendar-event"></i><i class="ti ti-user"></i></div>`;
const status=`<div style="height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:14px;font-weight:600"><span>9:41</span><span><i class="ti ti-wifi"></i> <i class="ti ti-battery-3"></i></span></div>`;
function dev(kind,inner,scale,label){const W={phone:390,tab:1180,desk:1440}[kind],H={phone:844,tab:820,desk:900}[kind];const bw=kind=="phone"?20:kind=="tab"?28:2;
 return `<div class="dev" style="width:${(W+bw)*scale}px;height:${(H+bw+(kind=="desk"?34:0))*scale+24}px"><div class="frame ${kind}" style="transform:scale(${scale});overflow:hidden">${kind=="desk"?`<div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="m" style="margin-left:10px;font-size:13px">DJMetry — Рейтинг</span></div>`:""}${inner}</div><div class="lbl" style="position:absolute;left:0;right:0;top:${(H+bw+(kind=="desk"?34:0))*scale+4}px">${label}</div></div>`}
const FLAGS=["🇺🇸 US","🇬🇧 GB","🇩🇪 DE","🇳🇱 NL","🇫🇷 FR","🇧🇪 BE","🇪🇸 ES","🇮🇹 IT","🇧🇷 BR","🇲🇽 MX","🇨🇦 CA","🇦🇺 AU","🇸🇪 SE","🇳🇴 NO","🇵🇱 PL","🇺🇦 UA","🇹🇷 TR"];
const GEN=["techno","house","edm","melodic techno","tech house","deep house","trance","drum and bass","afro house","progressive house"];
const chip=(t,on,x)=>`<span class="chip" style="white-space:nowrap;${on?"background:var(--g);color:var(--bg);font-weight:700":""}">${t}${x?" ✕":""}</span>`;
const V=[];
/* ===== A · Капсула + шкала ===== */
const capsule=(w)=>`<div style="display:flex;background:var(--p);border-radius:999px;padding:4px;position:relative;${w?`width:${w}px`:""}">${["DJMetry","Ambient","DJ Mag","Итоги года"].map((t,k)=>`<div style="flex:1;text-align:center;padding:9px 6px;border-radius:999px;font-size:13.5px;font-weight:700;white-space:nowrap;${k==0?"background:linear-gradient(90deg,#5EE6A8,#7DA7FF);color:#0B1220;box-shadow:0 6px 18px rgba(94,230,168,.35)":""}">${t}</div>`).join("")}</div>`;
const ruler=`<div style="position:relative;padding:4px 0 2px"><div style="display:flex;gap:6px;overflow:hidden">${["1–100","101–200","201–300","301–400","401–500","501–600","601–700","701–800","801–900","901–1000","Talents"].map((t,k)=>`<div style="flex:none;text-align:center;min-width:70px"><div style="height:${k==0?22:12}px;width:2px;margin:0 auto 6px;background:${k==0?"var(--g)":"#2C3D5C"};border-radius:1px"></div><span style="font-size:12px;font-weight:${k==0?800:500};${k==0?"color:var(--g)":""}" class="${k==0?"":"m"}">${t}</span></div>`).join("")}</div></div>`;
const filtersA=`<div style="display:flex;gap:8px">${chip("🌍 Все страны ▾")}${chip("🎵 Все жанры ▾")}</div>`;
const sheetCountry=`<div style="position:absolute;inset:0;background:rgba(5,9,18,.55)"></div><div style="position:absolute;left:0;right:0;bottom:0;background:var(--p);border-radius:26px 26px 0 0;padding:10px 16px 26px"><div style="width:40px;height:5px;border-radius:3px;background:#2C3D5C;margin:0 auto 12px"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="font-size:19px">Страна</b><span class="g" style="font-size:13px">Сбросить</span></div><div class="chip" style="display:block;padding:11px 14px;margin-bottom:12px"><i class="ti ti-search"></i> Найти страну</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${FLAGS.slice(0,12).map((f,k)=>`<div style="background:${k==0?"var(--g2)":"var(--p2)"};${k==0?"box-shadow:inset 0 0 0 2px #5EE6A8;":""}border-radius:14px;padding:10px 4px;text-align:center"><div style="font-size:24px">${f.split(" ")[0]}</div><div style="font-size:12px;font-weight:700;margin-top:3px">${f.split(" ")[1]}</div></div>`).join("")}</div></div>`;
const filterPanel=(cols)=>`<div class="card" style="display:flex;flex-direction:column;gap:12px"><b>Страна</b><div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:7px">${FLAGS.slice(0,cols*3).map((f,k)=>`<div style="background:${k==0?"var(--g2)":"var(--p2)"};${k==0?"box-shadow:inset 0 0 0 2px #5EE6A8;":""}border-radius:12px;padding:7px 2px;text-align:center;font-size:12px;font-weight:700">${f}</div>`).join("")}</div><b>Жанр</b><div class="chip" style="display:block;padding:9px 12px"><i class="ti ti-search"></i> Найти жанр</div><div style="display:flex;flex-wrap:wrap;gap:6px">${GEN.slice(0,8).map((g,k)=>chip(g,k==0)).join("")}</div></div>`;
V.push({t:"A · Капсула и шкала сотен",s:"Верхний уровень — капсула с 4 типами (как сегмент iOS, цветная «таблетка» переезжает). Под ней — шкала диапазонов: 1–100 … 901–1000 и Talents, листается пальцем как линейка; для DJ Mag и «Итогов года» шкала превращается в годы. Страна и жанр — два чипа, открывают шторку: флаги сеткой + поиск. Планшет и десктоп — фильтры постоянной панелью слева.",
phone:`${status}<div style="padding:4px 16px 120px;display:flex;flex-direction:column;gap:12px"><div style="font-size:30px;font-weight:800">Рейтинг</div>${capsule()}${ruler}${filtersA}${rows(4)}</div>${sheetCountry}`,
tab:`<div style="position:absolute;inset:0;padding:26px 30px 26px 128px;display:grid;grid-template-columns:300px 1fr;gap:24px;overflow:hidden"><div style="display:flex;flex-direction:column;gap:14px"><div style="font-size:30px;font-weight:800">Рейтинг</div>${filterPanel(3)}</div><div style="display:flex;flex-direction:column;gap:12px;padding-top:4px">${capsule()}${ruler}${rows(6)}</div></div>${rail}`,
desk:`<div style="position:absolute;inset:34px 0 0 0;padding:24px 28px 24px 128px;display:grid;grid-template-columns:320px 1fr;gap:26px;overflow:hidden"><div style="display:flex;flex-direction:column;gap:14px"><div style="font-size:32px;font-weight:800">Рейтинг</div>${filterPanel(4)}</div><div style="display:flex;flex-direction:column;gap:12px;padding-top:6px">${capsule(620)}${ruler}${rows(7)}</div></div>${rail}`});
/* ===== B · Заголовок-меню ===== */
const titleMenu=(sz)=>`<div style="display:flex;align-items:center;gap:8px"><div style="font-size:${sz}px;font-weight:800;letter-spacing:-.5px">DJMetry TOP 100</div><span style="width:30px;height:30px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center"><i class="ti ti-chevron-down g"></i></span></div><div class="m" style="font-size:12.5px;margin-top:-6px">Глобальный рейтинг · места 1–100 · обновлено 12 мин назад</div>`;
const activeFilters=`<div style="display:flex;gap:8px;flex-wrap:wrap">${chip("🇺🇸 США",1,1)}${chip("techno",1,1)}${chip("+ Фильтр")}</div>`;
const menuCard=(t,sub,items,on)=>`<div class="card" style="display:flex;flex-direction:column;gap:10px;${on?"box-shadow:inset 0 0 0 2px #5EE6A8":""}"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px">${t}</b><span class="m" style="font-size:12px">${sub}</span></div><div style="display:flex;flex-wrap:wrap;gap:6px">${items.map((x,k)=>chip(x,on&&k==0)).join("")}</div></div>`;
const menu=`${menuCard("DJMetry","по Score",["TOP 100","200","300","400","500","600","700","800","900","1000","Talents"],1)}${menuCard("Ambient","по Score",["TOP 100","200","300","Talents"])}${menuCard("DJ Mag","по годам",["2025","2024","2023","2022"])}${menuCard("Итоги года","финал сезона",["2025","2024"])}`;
V.push({t:"B · Заголовок-меню",s:"Как в Apple Music: крупный заголовок «DJMetry TOP 100 ▾» и есть навигация. Тап — шторка с карточками: DJMetry, Ambient, DJ Mag, Итоги года, внутри — диапазоны или годы. Под заголовком — активные фильтры чипами с ✕ и «+ Фильтр». Экран чистый, всё переключение — в одном месте. Планшет — меню поповером от заголовка, десктоп — мега-меню.",
phone:`${status}<div style="padding:4px 16px 120px;display:flex;flex-direction:column;gap:12px">${titleMenu(28)}${activeFilters}${rows(3)}</div><div style="position:absolute;inset:0;background:rgba(5,9,18,.55)"></div><div style="position:absolute;left:0;right:0;bottom:0;background:var(--p);border-radius:26px 26px 0 0;padding:10px 14px 26px;display:flex;flex-direction:column;gap:10px"><div style="width:40px;height:5px;border-radius:3px;background:#2C3D5C;margin:0 auto 2px"></div><b style="font-size:19px;margin-left:4px">Какой рейтинг</b>${menu.replaceAll('class="card"','class="card" style="background:var(--p2)"')}</div>`,
tab:`<div style="position:absolute;inset:0;padding:26px 30px 26px 128px;display:flex;flex-direction:column;gap:12px;overflow:hidden">${titleMenu(30)}${activeFilters}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${rows(8)}</div></div><div style="position:absolute;left:128px;top:96px;width:520px;display:flex;flex-direction:column;gap:10px;background:var(--p2);border-radius:24px;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.75)">${menu}</div>${rail}`,
desk:`<div style="position:absolute;inset:34px 0 0 0;padding:24px 28px 24px 128px;display:flex;flex-direction:column;gap:12px;overflow:hidden">${titleMenu(32)}${activeFilters}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${rows(8)}</div></div><div style="position:absolute;left:128px;top:150px;right:28px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:var(--p2);border-radius:24px;padding:16px;box-shadow:0 30px 80px rgba(0,0,0,.75)">${menu}</div>${rail}`});
/* ===== C · Вкладки + указатель позиций ===== */
const tabs=`<div style="display:flex;gap:22px;border-bottom:1px solid #1F2D45">${["DJMetry","Ambient","DJ Mag","Итоги года"].map((t,k)=>`<div style="padding:10px 0;font-size:15px;font-weight:${k==0?800:600};${k==0?"color:var(--g);box-shadow:inset 0 -3px 0 #5EE6A8":"color:#9AB0D5"};white-space:nowrap">${t}</div>`).join("")}</div>`;
const index=`<div style="position:absolute;right:6px;top:190px;bottom:130px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;background:rgba(18,27,44,.8);border-radius:14px;padding:8px 4px">${["1","100","200","300","400","500","600","700","800","900","1K","★"].map((t,k)=>`<span style="font-size:10.5px;font-weight:800;${k==2?"color:#0B1220;background:var(--g);border-radius:6px;padding:1px 3px":"color:#9AB0D5"}">${t}</span>`).join("")}</div><div style="position:absolute;right:48px;top:250px;background:var(--g);color:#0B1220;font-weight:800;font-size:20px;border-radius:16px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5)">201–300</div>`;
const section=(t)=>`<div class="m" style="font-size:12px;font-weight:800;letter-spacing:.6px;margin:6px 4px 0">${t}</div>`;
const fab=`<div style="position:absolute;right:18px;bottom:110px;display:flex;align-items:center;gap:8px;background:var(--p);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:12px 16px;box-shadow:0 12px 30px rgba(0,0,0,.6)"><i class="ti ti-adjustments-horizontal g"></i><b>Фильтры</b><span style="background:var(--g);color:#0B1220;border-radius:10px;font-size:12px;font-weight:800;padding:1px 7px">2</span></div>`;
const tree=`<div style="display:flex;flex-direction:column;gap:4px">${[["DJMetry",1],["  TOP 100",2],["  TOP 200"],["  TOP 300"],["  …1000"],["  Talents"],["Ambient"],["DJ Mag"],["  2025"],["  2024"],["Итоги года"]].map(([t,on])=>`<div style="padding:8px 12px;border-radius:10px;font-size:14px;font-weight:${t.startsWith("  ")?500:800};${on==2?"background:var(--g2);color:var(--g)":on==1?"color:var(--g)":""};padding-left:${t.startsWith("  ")?26:12}px">${t.trim()}</div>`).join("")}</div>`;
V.push({t:"C · Вкладки и указатель позиций",s:"Типы — классические вкладки с подчёркиванием. Вместо переключателя сотен весь рейтинг — один длинный список с разделами «1–100», «101–200»…, а справа указатель, как алфавит в «Контактах»: ведёшь пальцем — прыгаешь к 700-му месту, крупная подсказка показывает диапазон. Фильтры — плавающая кнопка с числом активных. Десктоп — дерево рейтингов слева.",
phone:`${status}<div style="padding:4px 16px 120px;display:flex;flex-direction:column;gap:10px"><div style="font-size:30px;font-weight:800">Рейтинг</div>${tabs}${section("1–100")}${rows(2)}${section("201–300")}${rows(3,5)}</div>${index}${fab}${pill}`,
tab:`<div style="position:absolute;inset:0;padding:26px 60px 26px 128px;display:flex;flex-direction:column;gap:10px;overflow:hidden"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:30px;font-weight:800">Рейтинг</div>${chip("🇺🇸 США",1,1)}</div>${tabs}${section("1–100")}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${rows(4)}</div>${section("201–300")}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${rows(4,4)}</div></div>${index.replace("top:190px","top:170px")}${rail}`,
desk:`<div style="position:absolute;inset:34px 0 0 0;padding:24px 60px 24px 128px;display:grid;grid-template-columns:240px 1fr 280px;gap:24px;overflow:hidden"><div><div style="font-size:30px;font-weight:800;margin-bottom:12px">Рейтинг</div>${tree}</div><div style="display:flex;flex-direction:column;gap:10px;padding-top:52px">${section("1–100")}${rows(4)}${section("201–300")}${rows(3,5)}</div><div style="padding-top:52px">${filterPanel(3)}</div></div>${index.replace("top:190px","top:120px")}${rail}`});
root.innerHTML=V.map(v=>`<h2>${v.t}</h2><div class="sub">${v.s}</div><div class="row">${dev("phone",v.phone,.62,"Телефон")}${dev("tab",v.tab,.42,"iPad альбом")}${dev("desk",v.desk,.42,"Десктоп")}</div>`).join("");
</script></body></html>
