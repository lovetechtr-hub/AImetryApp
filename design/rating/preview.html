<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>DJMetry — таблица рейтинга</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
<style>
:root{--bg:#0B1220;--p:#121B2C;--p2:#0E1728;--line:#1F2D45;--g:#5EE6A8;--g2:#10302A;--t:#E6EEFC;--m:#9AB0D5;--o:#FFB35B;--r:#FF6B6B;--b:#7DA7FF}
*{box-sizing:border-box}body{margin:0;background:#07090f;font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--t);padding:22px}
h2{font-size:22px;margin:34px 0 4px}.sub{color:var(--m);font-size:14px;margin-bottom:14px}
.row{display:flex;gap:26px;align-items:flex-start}
.dev{position:relative;flex:none}.dev .lbl{color:var(--m);font-size:12.5px;margin-top:8px;text-align:center}
.frame{background:var(--bg);overflow:hidden;position:relative;transform-origin:top left}
.phone{width:390px;height:844px;border-radius:52px;border:10px solid #1b1d23}
.tab{width:1180px;height:820px;border-radius:40px;border:14px solid #1b1d23}
.desk{width:1440px;height:900px;border-radius:14px;border:1px solid #2a2d35}
.bar{height:34px;background:#1a1d24;display:flex;align-items:center;gap:8px;padding:0 14px}.bar i{width:12px;height:12px;border-radius:50%;display:inline-block}
.m{color:var(--m)}.g{color:var(--g)}.o{color:var(--o)}
.cv{position:relative;flex:none;overflow:hidden;background:#1A2740;border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 26px -12px rgba(0,0,0,.85)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.22),transparent 38%,transparent 60%,rgba(0,0,0,.3))}
.card{background:var(--p);border:1px solid rgba(255,255,255,.07);border-radius:22px;padding:16px}
.h{display:flex;justify-content:space-between;align-items:center;font-weight:650;font-size:15px;margin-bottom:12px}.h span{font-size:12.5px;color:var(--g);font-weight:500}
.metric{background:var(--p2);border-radius:16px;padding:12px}.metric b{display:block;font-size:22px}.metric small{color:var(--m);font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;height:50px;font-weight:650;font-size:15px}
.btn.pri{background:var(--g);color:var(--bg)}.btn.sec{background:var(--p);border:1px solid var(--line);color:var(--t)}
.tile{background:var(--p);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tile i{font-size:24px;color:var(--g)}.tile b{font-size:14.5px}.tile small{color:var(--m);font-size:12px}
.pill{position:absolute;left:18px;right:18px;bottom:26px;height:68px;border-radius:34px;background:rgba(18,27,44,.96);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-evenly}
.rail{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:76px;padding:14px 0;border-radius:38px;background:rgba(18,27,44,.96);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;gap:20px}
.pill i,.rail i{font-size:26px;color:#6F84A8}.pill .on,.rail .on{color:var(--g)}
.hash{width:56px;height:56px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:900;font-size:30px}
.badge{background:var(--r);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.st{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:8px 0;border-top:1px solid rgba(255,255,255,.05)}
.chip{font-size:12px;padding:6px 11px;border-radius:14px;background:var(--p2);color:var(--m)}
.spark{height:70px;width:100%}
.seg{display:flex;gap:6px}.seg span{padding:8px 14px;border-radius:12px;background:var(--p);color:var(--m);font-size:13.5px}.seg .on{background:var(--g);color:var(--bg);font-weight:650}
.navlist div{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-size:14.5px;color:var(--m)}.navlist div i{font-size:20px}.navlist .on{background:var(--p);color:var(--t)}.navlist .on i{color:var(--g)}
</style></head><body>
<div id="root"></div>
<script>
const I="https://i.scdn.co/image/";
// [место, имя, фото, Score, жанр, изменение места, DJ Mag, голоса, подписчики Spotify]
const R=[[1,"David Guetta","ab6761610000e5ebf150017ca69c8793503c2d4f",53.16,"edm",0,7,3,"28.6M"],[2,"Calvin Harris","ab6761610000e5eb8ebba5e60113b48de8c11f6b",51.46,"edm",0,null,0,"24.1M"],[3,"Tiësto","ab6761610000e5ebf4973f7346a2f35e56b63d57",48.72,"edm",0,null,0,"8.9M"],[4,"Martin Garrix","ab6761610000e5ebf5b8ee60f1f4ee3453aba40b",48.32,"edm",0,2,0,"15.4M"],[5,"Alok","ab6761610000e5eb6b07a040a57d013a7e49f908",48.27,"brazilian bass",0,3,0,"9.2M"],
[94,"Felix Jaehn","ab6761610000e5eb80a88a9f1e9266d2f5e96b8b",33.66,"tropical house",2,null,0,"2.1M"],[95,"Ofenbach","ab6761610000e5eb9c2cec3972062e6084f60be5",33.45,"house",-3,77,0,"1.6M"],[96,"Paul Kalkbrenner","ab6761610000e5ebb72a52d500aa9e245f9ee6a1",33.42,"minimal techno",2,null,0,"1.2M"],[97,"Kaskade","ab6761610000e5ebe753ae706df5e8a8da8497cc",33.29,"edm",2,84,0,"1.4M"],[98,"D.O.D","ab6761610000e5eb30a4fa2462f1d9a9cdd17360",33.16,"house",3,79,0,"0.6M"],[99,"Porter Robinson","ab6761610000e5ebf67786cf70976b5d87b27b5a",33.14,"edm",3,96,0,"2.3M"],[100,"Martin Solveig","ab6761610000e5eb7520cf8cf5c0395d388ce696",33.10,"french house",0,98,0,"1.9M"]];
const LEAD=R[0][3];
const cv=(s,w,h,r=12,ex="")=>`<div class="cv" style="width:${w}px;height:${h}px;border-radius:${r}px;flex:none;${ex}"><img src="${I+s}"></div>`;
const ch=(d,small)=>d>0?`<span style="color:var(--g);font-size:${small?10.5:12}px;font-weight:700">▲${d}</span>`:d<0?`<span style="color:#FF6B6B;font-size:${small?10.5:12}px;font-weight:700">▼${-d}</span>`:`<span class="m" style="font-size:${small?10.5:12}px">—</span>`;
const pill=`<div class="pill"><i class="ti ti-trophy on"></i><i class="ti ti-radar-2"></i><div class="hash">#</div><i class="ti ti-calendar-event"></i><i class="ti ti-user"></i></div>`;
const rail=`<div class="rail"><i class="ti ti-trophy on"></i><i class="ti ti-radar-2"></i><div class="hash">#</div><i class="ti ti-calendar-event"></i><i class="ti ti-user"></i></div>`;
const status=`<div style="height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:14px;font-weight:600"><span>9:41</span><span><i class="ti ti-wifi"></i> <i class="ti ti-battery-3"></i></span></div>`;
const seg=(on,items=["TOP 100","Растут","Прорывы","DJ Mag"])=>`<div class="seg" style="white-space:nowrap">${items.map((t,k)=>`<span class="${k==on?"on":""}" style="white-space:nowrap;padding-left:10px;padding-right:10px">${t}</span>`).join("")}</div>`;
const chips=`<div style="display:flex;gap:6px;overflow:hidden">${["Все жанры ▾","Страна ▾","Только DJ"].map((t,k)=>`<span class="chip" style="${k==2?"background:var(--g2);color:var(--g)":""}">${t}</span>`).join("")}</div>`;
const gap=`<div class="m" style="text-align:center;font-size:12px;padding:4px 0">· · · 6–93 · · ·</div>`;
function dev(kind,inner,scale,label){const W={phone:390,tab:1180,desk:1440}[kind],H={phone:844,tab:820,desk:900}[kind];const bw=kind=="phone"?20:kind=="tab"?28:2;
 return `<div class="dev" style="width:${(W+bw)*scale}px;height:${(H+bw+(kind=="desk"?34:0))*scale+24}px"><div class="frame ${kind}" style="transform:scale(${scale})">${kind=="desk"?`<div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="m" style="margin-left:10px;font-size:13px">DJMetry — Рейтинг</span></div>`:""}${inner}</div><div class="lbl" style="position:absolute;left:0;right:0;top:${(H+bw+(kind=="desk"?34:0))*scale+4}px">${label}</div></div>`}
const rows=(list,fn)=>list.map((r,k)=>fn(r,k)).join("");
const top5=R.slice(0,5), tail=R.slice(5);
/* ===== A · Чистый список ===== */
const rowA=(r)=>`<div style="display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:16px;background:var(--p)">
 <div style="width:34px;text-align:right;flex:none"><b style="font-size:15px;font-variant-numeric:tabular-nums">${r[0]}</b><div>${ch(r[5],1)}</div></div>
 ${cv(r[2],46,46,13)}<div style="flex:1;min-width:0"><div style="font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r[1]}</div><div class="m" style="font-size:12.5px">${r[4]}${r[6]?` · <span class="o">DJ Mag #${r[6]}</span>`:""}</div></div>
 <b style="font-size:16px;font-variant-numeric:tabular-nums">${r[3].toFixed(2)}</b></div>`;
const hdrA=(big)=>`<div style="display:flex;align-items:baseline;justify-content:space-between"><div style="font-size:${big?30:28}px;font-weight:800;letter-spacing:-.5px">Рейтинг</div><span class="m" style="font-size:12px">обновлено 12 мин назад</span></div>`;
const tableA=`<div class="card" style="padding:0;overflow:hidden"><div style="display:grid;grid-template-columns:56px 1fr 150px 90px 80px 110px;gap:0;padding:12px 18px;font-size:12px" class="m"><span>#</span><span>Артист</span><span>Жанр</span><span>DJ Mag</span><span>Голоса</span><span style="text-align:right">Score ▾</span></div>
 ${rows(R.slice(0,5).concat(R.slice(7,11)),r=>`<div style="display:grid;grid-template-columns:56px 1fr 150px 90px 80px 110px;align-items:center;padding:9px 18px;border-top:1px solid #1F2D45"><span><b style="font-variant-numeric:tabular-nums">${r[0]}</b> ${ch(r[5],1)}</span><span style="display:flex;align-items:center;gap:12px">${cv(r[2],38,38,11)}<b style="font-size:14.5px">${r[1]}</b></span><span class="m" style="font-size:13px">${r[4]}</span><span class="o" style="font-size:13px">${r[6]?"#"+r[6]:"—"}</span><span style="font-size:13px">${r[7]}</span><b style="text-align:right;font-variant-numeric:tabular-nums">${r[3].toFixed(2)}</b></div>`)}</div>`;
const detail=(r)=>`<div class="card" style="display:flex;flex-direction:column;gap:12px;align-self:start"><div style="position:relative;height:230px;border-radius:18px;overflow:hidden"><img src="${I+r[2]}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#121B2C)"></div><div style="position:absolute;left:14px;bottom:12px"><span class="chip" style="background:var(--g);color:var(--bg);font-weight:700">#${r[0]}</span><div style="font-size:24px;font-weight:800;margin-top:6px">${r[1]}</div></div></div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="metric"><b style="font-size:18px" class="g">${r[3]}</b><small>Score</small></div><div class="metric"><b style="font-size:18px">${r[8]}</b><small>Spotify</small></div></div>
 <div class="btn pri"><i class="ti ti-heart"></i>Следить</div><div class="btn sec">Открыть карточку</div></div>`;
const V=[];
V.push({t:"A · Чистый список",s:"Строка = место с изменением под ним (колонка фиксированной ширины — «100» не рвётся), фото, имя в одну строку, жанр и DJ Mag, Score справа. Сверху — подборки и фильтры. Планшет — список + карточка выбранного артиста справа. Десктоп — настоящая таблица с колонками и сортировкой.",
phone:`${status}<div style="padding:4px 16px 120px;display:flex;flex-direction:column;gap:10px">${hdrA()}${seg(0)}${chips}${rows(top5.slice(0,3),rowA)}${gap}${rows(tail.slice(3),rowA)}</div>${pill}`,
tab:`<div style="position:absolute;inset:0;padding:26px 30px 26px 128px;display:grid;grid-template-columns:1fr 340px;gap:24px"><div style="display:flex;flex-direction:column;gap:10px;overflow:hidden">${hdrA(1)}${seg(0)}${chips}${rows(top5,rowA)}${gap}${rows(tail.slice(2,6),rowA)}</div>${detail(R[3])}</div>${rail}`,
desk:`<div style="position:absolute;inset:34px 0 0 0;padding:24px 28px 24px 128px;display:grid;grid-template-columns:1fr 340px;gap:24px"><div style="display:flex;flex-direction:column;gap:12px">${hdrA(1)}<div style="display:flex;justify-content:space-between;align-items:center">${seg(0)}${chips}</div>${tableA}</div>${detail(R[3])}</div>${rail}`});
/* ===== B · Подиум ===== */
const podium=(scale=1)=>{const P=[R[1],R[0],R[2]],H=[150,190,130].map(x=>x*scale),C=["#C0C7D6","#F5C542","#CD8B4E"];
 return `<div style="display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end">${P.map((r,k)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
 <div style="position:relative">${cv(r[2],(k==1?92:74)*scale,(k==1?92:74)*scale,(k==1?26:22)*scale,`box-shadow:0 0 0 3px ${C[k]}`)}<span style="position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);background:${C[k]};color:#0B1220;font-weight:800;font-size:12px;border-radius:10px;padding:2px 8px">${r[0]}</span></div>
 <div style="font-size:${14*scale}px;font-weight:700;margin-top:6px;line-height:1.15">${r[1]}</div><b class="g" style="font-size:${15*scale}px">${r[3]}</b>
 <div style="width:100%;height:${H[k]*0.35}px;border-radius:14px 14px 4px 4px;background:linear-gradient(180deg,${C[k]}33,transparent)"></div></div>`).join("")}</div>`};
const rowB=(r)=>`<div class="st" style="display:flex;align-items:center;gap:12px;padding:10px 4px"><b style="width:32px;text-align:right;font-size:15px;font-variant-numeric:tabular-nums;flex:none">${r[0]}</b>${cv(r[2],42,42,12)}<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r[1]}</div><div class="m" style="font-size:12px">${r[4]}</div></div><div style="text-align:right"><b style="font-size:15px;font-variant-numeric:tabular-nums">${r[3].toFixed(2)}</b><div>${ch(r[5],1)}</div></div></div>`;
V.push({t:"B · Подиум",s:"Топ‑3 — подиум с крупными фото (золото, серебро, бронза), дальше список с 4‑го места; изменение места под Score. Для «Растут» и «Прорывов» подиум показывает лидеров подборки. Планшет — подиум сверху, список в две колонки. Десктоп — подиум слева, длинный список справа.",
phone:`${status}<div style="padding:4px 16px 120px;display:flex;flex-direction:column;gap:12px"><div style="font-size:28px;font-weight:800">Рейтинг</div>${seg(0)}<div class="card" style="padding:18px 12px 6px">${podium(1)}</div><div class="card" style="padding:4px 12px">${rows(R.slice(3,5),rowB)}${gap}${rows(tail.slice(4),rowB)}</div></div>${pill}`,
tab:`<div style="position:absolute;inset:0;padding:26px 30px 26px 128px;display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:30px;font-weight:800">Рейтинг</div>${seg(0)}</div><div class="card" style="padding:20px 60px 6px">${podium(1.1)}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div class="card" style="padding:4px 14px">${rows(R.slice(3,5).concat(tail.slice(0,2)),rowB)}</div><div class="card" style="padding:4px 14px">${rows(tail.slice(2,6),rowB)}</div></div></div>${rail}`,
desk:`<div style="position:absolute;inset:34px 0 0 0;padding:24px 28px 24px 128px;display:grid;grid-template-columns:480px 1fr;gap:24px"><div style="display:flex;flex-direction:column;gap:14px"><div style="font-size:32px;font-weight:800">Рейтинг</div>${seg(0)}${chips}<div class="card" style="padding:22px 16px 6px">${podium(1.15)}</div></div><div class="card" style="padding:4px 16px;align-self:start">${rows(R.slice(3,5),rowB)}${gap}${rows(tail,rowB)}</div></div>${rail}`});
/* ===== C · Лидерборд со шкалой ===== */
const rowC=(r,wide)=>`<div style="padding:10px 12px;border-radius:16px;background:var(--p);display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:center;gap:12px">
 <div style="width:40px;height:40px;border-radius:12px;background:${r[0]<=3?"var(--g)":"var(--p2)"};color:${r[0]<=3?"var(--bg)":"inherit"};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:${r[0]>=100?13:15}px;flex:none">${r[0]}</div>
 ${cv(r[2],40,40,12)}<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r[1]}</div><div class="m" style="font-size:12px">${r[4]} · ${ch(r[5],1)}</div></div><b style="font-size:16px;font-variant-numeric:tabular-nums">${r[3].toFixed(2)}</b></div>
 <div style="height:6px;border-radius:3px;background:#1F2D45"><div style="height:6px;border-radius:3px;width:${(r[3]/LEAD*100).toFixed(0)}%;background:linear-gradient(90deg,#2FA878,var(--g))"></div></div></div>`;
const tableC=`<div class="card" style="padding:0;overflow:hidden"><div style="display:grid;grid-template-columns:60px 280px 1fr 90px 80px 80px;padding:12px 18px;font-size:12px" class="m"><span>#</span><span>Артист</span><span>Score относительно лидера</span><span>Δ место</span><span>DJ Mag</span><span style="text-align:right">Score</span></div>
 ${rows(R.slice(0,5).concat(R.slice(7,11)),r=>`<div style="display:grid;grid-template-columns:60px 280px 1fr 90px 80px 80px;align-items:center;padding:9px 18px;border-top:1px solid #1F2D45"><b style="font-variant-numeric:tabular-nums">${r[0]}</b><span style="display:flex;align-items:center;gap:12px">${cv(r[2],36,36,10)}<b style="font-size:14.5px">${r[1]}</b></span><div style="height:8px;border-radius:4px;background:#1F2D45;margin-right:24px"><div style="height:8px;border-radius:4px;width:${(r[3]/LEAD*100).toFixed(0)}%;background:linear-gradient(90deg,#2FA878,var(--g))"></div></div><span>${ch(r[5])}</span><span class="o" style="font-size:13px">${r[6]?"#"+r[6]:"—"}</span><b style="text-align:right;font-variant-numeric:tabular-nums">${r[3].toFixed(2)}</b></div>`)}</div>`;
V.push({t:"C · Лидерборд со шкалой",s:"Место — плашка фиксированного размера (топ‑3 зелёные), под каждой строкой полоса Score относительно лидера — видно, насколько близко артист к вершине. Планшет — две колонки строк. Десктоп — таблица, где полоса Score — отдельная колонка.",
phone:`${status}<div style="padding:4px 16px 120px;display:flex;flex-direction:column;gap:10px"><div style="font-size:28px;font-weight:800">Рейтинг</div>${seg(0)}${chips}${rows(top5.slice(0,3),r=>rowC(r))}${gap}${rows(tail.slice(4),r=>rowC(r))}</div>${pill}`,
tab:`<div style="position:absolute;inset:0;padding:26px 30px 26px 128px;display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:30px;font-weight:800">Рейтинг</div>${seg(0)}</div>${chips}<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${rows(R.slice(0,4).concat(tail.slice(2,6)),r=>rowC(r))}</div></div>${rail}`,
desk:`<div style="position:absolute;inset:34px 0 0 0;padding:24px 28px 24px 128px;display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:32px;font-weight:800">Рейтинг</div><div style="display:flex;gap:14px;align-items:center">${chips}${seg(0)}</div></div>${tableC}</div>${rail}`});
root.innerHTML=V.map(v=>`<h2>${v.t}</h2><div class="sub">${v.s}</div><div class="row">${dev("phone",v.phone,.62,"Телефон")}${dev("tab",v.tab,.42,"iPad альбом")}${dev("desk",v.desk,.42,"Десктоп")}</div>`).join("");
</script></body></html>
