<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>DJMetry — карточка артиста</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
<style>
:root{--bg:#0B1220;--p:#121B2C;--p2:#0E1728;--line:#1F2D45;--g:#5EE6A8;--g2:#10302A;--t:#E6EEFC;--m:#9AB0D5;--o:#FFB35B;--r:#FF6B6B;--b:#7DA7FF}
*{box-sizing:border-box}body{margin:0;background:#07090f;font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--t);padding:22px}
h2{font-size:22px;margin:34px 0 4px}.sub{color:var(--m);font-size:14px;margin-bottom:14px}
.row{display:flex;gap:26px;align-items:flex-start}
.dev{position:relative;flex:none}.dev .lbl{color:var(--m);font-size:12.5px;margin-top:8px;text-align:center}
.frame{background:var(--bg);overflow:hidden;position:relative;transform-origin:top left}
.phone{width:390px;height:844px;border-radius:52px;border:10px solid #1b1d23}
.tab{width:1180px;height:820px;border-radius:40px;border:14px solid #1b1d23}
.desk{width:1440px;height:900px;border-radius:14px;border:1px solid #2a2d35}
.bar{height:34px;background:#1a1d24;display:flex;align-items:center;gap:8px;padding:0 14px}.bar i{width:12px;height:12px;border-radius:50%;display:inline-block}
.m{color:var(--m)}.g{color:var(--g)}.o{color:var(--o)}
.cv{position:relative;flex:none;overflow:hidden;background:#1A2740;border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 26px -12px rgba(0,0,0,.85)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.22),transparent 38%,transparent 60%,rgba(0,0,0,.3))}
.card{background:var(--p);border:1px solid rgba(255,255,255,.07);border-radius:22px;padding:16px}
.h{display:flex;justify-content:space-between;align-items:center;font-weight:650;font-size:15px;margin-bottom:12px}.h span{font-size:12.5px;color:var(--g);font-weight:500}
.metric{background:var(--p2);border-radius:16px;padding:12px}.metric b{display:block;font-size:22px}.metric small{color:var(--m);font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;height:50px;font-weight:650;font-size:15px}
.btn.pri{background:var(--g);color:var(--bg)}.btn.sec{background:var(--p);border:1px solid var(--line);color:var(--t)}
.tile{background:var(--p);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tile i{font-size:24px;color:var(--g)}.tile b{font-size:14.5px}.tile small{color:var(--m);font-size:12px}
.pill{position:absolute;left:18px;right:18px;bottom:26px;height:68px;border-radius:34px;background:rgba(18,27,44,.96);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-evenly}
.rail{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:76px;padding:14px 0;border-radius:38px;background:rgba(18,27,44,.96);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;gap:20px}
.pill i,.rail i{font-size:26px;color:#6F84A8}.pill .on,.rail .on{color:var(--g)}
.hash{width:56px;height:56px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:900;font-size:30px}
.badge{background:var(--r);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.st{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:8px 0;border-top:1px solid rgba(255,255,255,.05)}
.chip{font-size:12px;padding:6px 11px;border-radius:14px;background:var(--p2);color:var(--m)}
.spark{height:70px;width:100%}
.seg{display:flex;gap:6px}.seg span{padding:8px 14px;border-radius:12px;background:var(--p);color:var(--m);font-size:13.5px}.seg .on{background:var(--g);color:var(--bg);font-weight:650}
.navlist div{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-size:14.5px;color:var(--m)}.navlist div i{font-size:20px}.navlist .on{background:var(--p);color:var(--t)}.navlist .on i{color:var(--g)}
</style></head><body>
<div id="root"></div>
<script>
const I="https://i.scdn.co/image/";
const A={name:"Martin Garrix",img:I+"ab67616100005174f5b8ee60f1f4ee3453aba40b",score:"48.32",pos:"#4",djmag:"#2 · 2025",djprev:"▲1 у лидера 2024",spotify:"15,4 млн",pop:78,yt:"15,2 млн",ytv:"7,17 млрд",follows:1,votes:0,genres:["edm","progressive house","electronica"]};
const TR=[["In the Name of Love","ab67616d0000b273b3d48927d5a423bdbdb20166",84,"3:18"],["Scared to Be Lonely","ab67616d0000b2736a1cba0e39d52540add955c6",78,"3:40"],["Animals","ab67616d0000b2736abad6915a2216dc18e7e3a7",76,"5:04"],["Repeat It","ab67616d0000b27399acb124b8c5a05f39e839d2",76,"3:11"],["High On Life","ab67616d0000b273def05abd2a12cd19243e2b6d",75,"3:50"]];
const EV=[["16","ОКТ","Palacio de los Deportes","Mexico City"],["17","ОКТ","Palacio de los Deportes","Mexico City"],["31","ОКТ","OMNIA Nightclub","Las Vegas"],["6","НОЯБ","EDC Orlando 2026","Orlando"],["6","НОЯБ","OMNIA Nightclub","Las Vegas"]];
const SOC=[["ti-brand-instagram","@martingarrix"],["ti-brand-tiktok","@martingarrix"],["ti-brand-x","@MartinGarrix"],["ti-brand-soundcloud","martingarrix"],["ti-brand-facebook","martin.garrix"],["ti-brand-apple","Apple Music"]];
const cv=(s,w,h,r=16,ex="")=>`<div class="cv" style="width:${w}px;height:${h}px;border-radius:${r}px;${ex}"><img src="${s}"></div>`;
const seal=`<i class="ti ti-rosette-discount-check" style="color:var(--g)"></i>`;
const pill=`<div class="pill"><i class="ti ti-trophy on"></i><i class="ti ti-radar-2"></i><div class="hash">#</div><i class="ti ti-calendar-event"></i><i class="ti ti-user"></i></div>`;
const rail=`<div class="rail"><i class="ti ti-trophy on"></i><i class="ti ti-radar-2"></i><div class="hash">#</div><i class="ti ti-calendar-event"></i><i class="ti ti-user"></i></div>`;
const status=`<div style="height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:14px;font-weight:600"><span>9:41</span><span><i class="ti ti-wifi"></i> <i class="ti ti-battery-3"></i></span></div>`;
const badges=`<div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip" style="background:var(--g);color:var(--bg);font-weight:700">DJMetry ${A.pos}</span><span class="chip" style="background:#3A2A12;color:var(--o);font-weight:700">DJ Mag ${A.djmag}</span></div>`;
const genreChips=(dark)=>`<div style="display:flex;gap:6px;flex-wrap:wrap">${A.genres.map(g=>`<span class="chip" style="${dark?"":"background:rgba(255,255,255,.14);color:#fff"}">${g}</span>`).join("")}</div>`;
const actions=(stack=false)=>`<div style="display:grid;grid-template-columns:${stack?"1fr":"1.3fr 1fr 52px"};gap:10px">
 <div class="btn pri"><i class="ti ti-heart"></i>Следить</div><div class="btn sec"><i class="ti ti-arrow-big-up-lines o"></i>Голос</div>${stack?"":`<div class="btn sec"><i class="ti ti-share-3"></i></div>`}</div>`;
const bookBtn=`<div class="btn sec" style="border-color:var(--g);color:var(--g)"><i class="ti ti-calendar-plus"></i>Забронировать <span class="m" style="font-size:11px;font-weight:500">если есть агентство</span></div>`;
const ring=(sz=86)=>`<div style="position:relative;width:${sz}px;height:${sz}px;flex:none"><svg width="${sz}" height="${sz}" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" fill="none" stroke="#1F2D45" stroke-width="3"/><circle cx="18" cy="18" r="15.9" fill="none" stroke="#5EE6A8" stroke-width="3" stroke-linecap="round" stroke-dasharray="48.3 100" transform="rotate(-90 18 18)"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1"><b style="font-size:${sz*.24}px">48.32</b><small class="m" style="font-size:${sz*.11}px">SCORE</small></div></div>`;
const scoreCard=`<div class="card"><div class="h">DJMetry Score <span>за 24 ч 0.00</span></div><div style="display:flex;gap:16px;align-items:center">${ring()}<div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px">
 <div class="metric"><b style="font-size:18px">${A.pos}</b><small>в мире</small></div><div class="metric"><b style="font-size:18px" class="o">#2</b><small>DJ Mag 2025</small></div>
 <div class="metric"><b style="font-size:18px">${A.spotify}</b><small>Spotify</small></div><div class="metric"><b style="font-size:18px">${A.pop}</b><small>популярность</small></div></div></div></div>`;
const tracks=(n=5)=>`<div class="card"><div class="h">Музыка <span>Spotify</span></div>${TR.slice(0,n).map(([t,c,p,d],k)=>`<div class="st" style="${k?"":"border:0"}"><span class="m" style="width:14px">${k+1}</span>${cv(I+c,44,44,11)}<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</div><div style="height:4px;border-radius:2px;background:#1F2D45;margin-top:6px"><div style="width:${p}%;height:4px;border-radius:2px;background:var(--g)"></div></div></div><span class="m" style="font-size:12px">${d}</span><i class="ti ti-player-play g"></i></div>`).join("")}</div>`;
const events=(n=4)=>`<div class="card"><div class="h">Концерты <span><i class="ti ti-map"></i> Карта</span></div>${EV.slice(0,n).map(([d,m,v,c],k)=>`<div class="st" style="${k?"":"border:0"}"><div style="width:48px;height:52px;border-radius:13px;background:${k?"var(--p2)":"var(--g2)"};display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none"><b style="font-size:18px" class="${k?"":"g"}">${d}</b><small style="font-size:9.5px" class="${k?"m":"g"}">${m}</small></div><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v}</div><div class="m" style="font-size:12px">${c}${k?"":" · ближайший"}</div></div><span class="chip" style="background:var(--g2);color:var(--g)">Билеты</span></div>`).join("")}</div>`;
const yt=`<div class="card"><div class="h">YouTube <span class="chip" style="background:#3a1414;color:#ff6b6b">OAC</span></div><div style="display:flex;gap:18px"><div><b style="font-size:22px">${A.yt}</b><div class="m" style="font-size:12px">подписчиков</div></div><div><b style="font-size:22px">${A.ytv}</b><div class="m" style="font-size:12px">просмотров</div></div></div></div>`;
const socials=`<div class="card"><div class="h">Соцсети <span><i class="ti ti-copy"></i> Ссылка</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${SOC.map(([i,t])=>`<div style="display:flex;gap:8px;align-items:center;background:var(--p2);border-radius:12px;padding:9px"><i class="ti ${i}" style="font-size:18px"></i><span style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</span></div>`).join("")}</div></div>`;
function dev(kind,inner,scale,label){const W={phone:390,tab:1180,desk:1440}[kind],H={phone:844,tab:820,desk:900}[kind];const bw=kind=="phone"?20:kind=="tab"?28:2;
 return `<div class="dev" style="width:${(W+bw)*scale}px;height:${(H+bw+(kind=="desk"?34:0))*scale+24}px"><div class="frame ${kind}" style="transform:scale(${scale})">${kind=="desk"?`<div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="m" style="margin-left:10px;font-size:13px">DJMetry — Martin Garrix</span></div>`:""}${inner}</div><div class="lbl" style="position:absolute;left:0;right:0;top:${(H+bw+(kind=="desk"?34:0))*scale+4}px">${label}</div></div>`}
const back=(glass)=>`<div style="width:40px;height:40px;border-radius:50%;background:${glass?"rgba(11,18,32,.55)":"var(--p)"};display:flex;align-items:center;justify-content:center"><i class="ti ti-arrow-left" style="font-size:20px"></i></div>`;
const V=[];
/* A · Постер */
const poster=(h)=>`<div style="position:relative;height:${h}px;overflow:hidden"><img src="${A.img}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
 <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,18,32,.25) 0%,transparent 25%,rgba(11,18,32,.6) 65%,#0B1220 100%)"></div>
 <div style="position:absolute;top:50px;left:16px;right:16px;display:flex;justify-content:space-between">${back(true)}${back(true).replace("ti-arrow-left","ti-share-3")}</div>
 <div style="position:absolute;left:18px;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px">${badges}<div style="font-size:38px;font-weight:800;letter-spacing:-1px;display:flex;align-items:center;gap:8px">${A.name} ${seal}</div>${genreChips()}</div></div>`;
V.push({t:"A · Постер",s:"Фото артиста на полэкрана, имя и места в рейтингах поверх, под ним действия и секции. Планшет — постер слева закреплён, контент справа; десктоп — широкий баннер и три колонки.",
phone:`<div style="position:absolute;inset:0;overflow:hidden">${poster(470)}<div style="padding:12px 16px;display:flex;flex-direction:column;gap:12px">${actions()}${scoreCard}${tracks(3)}</div></div>${pill}`,
tab:`<div style="position:absolute;inset:0;padding:26px 30px 26px 128px;display:grid;grid-template-columns:400px 1fr;gap:24px"><div style="display:flex;flex-direction:column;gap:12px"><div style="border-radius:28px;overflow:hidden">${poster(520).replace('top:50px','top:16px')}</div>${actions()}${bookBtn}</div>
 <div style="display:flex;flex-direction:column;gap:14px;overflow:hidden">${scoreCard}${tracks(4)}${events(2)}</div></div>${rail}`,
desk:`<div style="position:absolute;inset:34px 0 0 0;padding:24px 28px 24px 128px;display:flex;flex-direction:column;gap:18px">
 <div style="position:relative;height:300px;border-radius:30px;overflow:hidden;background:#0E1728"><img src="${A.img}" style="position:absolute;right:0;top:0;width:55%;height:100%;object-fit:cover;object-position:center 25%"><div style="position:absolute;inset:0;background:linear-gradient(90deg,#0E1728 45%,rgba(14,23,40,.4) 70%,transparent)"></div>
  <div style="position:absolute;left:32px;top:30px;bottom:30px;width:560px;display:flex;flex-direction:column;justify-content:space-between">${badges}<div><div style="font-size:52px;font-weight:800;letter-spacing:-1.5px;display:flex;align-items:center;gap:10px">${A.name} ${seal}</div>${genreChips(true)}</div><div style="width:460px">${actions()}</div></div></div>
 <div style="display:grid;grid-template-columns:1fr 1fr 380px;gap:20px">${tracks(5)}${events(4)}<div style="display:flex;flex-direction:column;gap:16px">${scoreCard}${yt}</div></div></div>${rail}`});
/* B · Карточка + вкладки */
const summary=(big)=>`<div style="display:flex;gap:14px;align-items:center">${cv(A.img,big?120:96,big?120:96,24,"transform:perspective(500px) rotateY(-10deg)")}<div style="flex:1;min-width:0"><div style="font-size:${big?30:24}px;font-weight:800;display:flex;align-items:center;gap:6px">${A.name} ${seal}</div><div class="m" style="font-size:12.5px;margin:4px 0 8px">${A.genres.join(" · ")}</div>${badges}</div></div>`;
const statRow=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div class="metric"><b style="font-size:19px" class="g">${A.score}</b><small>Score</small></div><div class="metric"><b style="font-size:19px">${A.spotify}</b><small>Spotify</small></div><div class="metric"><b style="font-size:19px">${A.yt}</b><small>YouTube</small></div></div>`;
const tabsBar=(on)=>`<div class="seg">${["Обзор","Музыка","Концерты","Соцсети"].map((t,k)=>`<span class="${k==on?"on":""}">${t}</span>`).join("")}</div>`;
V.push({t:"B · Карточка и вкладки",s:"Компактная шапка: объёмная обложка, имя, места в рейтингах; ниже цифры и действия, контент по вкладкам. Планшет — карточка слева, вкладки справа; десктоп — карточка, вкладки и колонка рейтингов.",
phone:`${status}<div style="padding:4px 16px 120px;display:flex;flex-direction:column;gap:12px">${summary()}${statRow}${actions()}${tabsBar(0)}${scoreCard}${tracks(2)}</div>${pill}`,
tab:`<div style="position:absolute;inset:0;padding:26px 30px 26px 128px;display:grid;grid-template-columns:380px 1fr;gap:24px"><div class="card" style="display:flex;flex-direction:column;gap:14px;align-self:start">${summary(true)}${statRow}${actions(true)}${bookBtn}${socials}</div><div style="display:flex;flex-direction:column;gap:14px">${tabsBar(1)}${tracks(5)}${yt}</div></div>${rail}`,
desk:`<div style="position:absolute;inset:34px 0 0 0;padding:24px 28px 24px 128px;display:grid;grid-template-columns:360px 1fr 360px;gap:22px"><div class="card" style="display:flex;flex-direction:column;gap:14px;align-self:start">${summary(true)}${statRow}${actions(true)}${bookBtn}</div>
 <div style="display:flex;flex-direction:column;gap:14px">${tabsBar(2)}${events(5)}<div class="card" style="height:190px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 60%,#10302A,#121B2C 60%)" ><span class="m"><i class="ti ti-map-2"></i> Карта концертов</span></div></div>
 <div style="display:flex;flex-direction:column;gap:14px">${scoreCard}${yt}${socials}</div></div>${rail}`});
/* C · Иммерсив */
const blur=`<img src="${A.img}" style="position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(40px) brightness(.45);transform:scale(1.1)"><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,18,32,.2),#0B1220 90%)"></div>`;
const carousel=(w)=>`<div style="display:flex;gap:12px;overflow:hidden">${[["Музыка","5 треков · In the Name of Love"],["Концерты","16 окт · Mexico City"],["YouTube","15,2 млн подписчиков"]].map(([t,s],k)=>`<div class="card" style="min-width:${w}px;background:${k?"rgba(18,27,44,.75)":"rgba(16,48,42,.85)"};backdrop-filter:blur(10px)"><div class="h" style="margin-bottom:8px">${t} <span><i class="ti ti-arrow-right"></i></span></div><div class="m" style="font-size:13px">${s}</div>${k==0?`<div style="display:flex;gap:6px;margin-top:10px">${TR.slice(0,4).map(t=>cv(I+t[1],48,48,10)).join("")}</div>`:""}</div>`).join("")}</div><div style="display:flex;gap:5px;justify-content:center;margin-top:10px"><i style="width:16px;height:5px;border-radius:3px;background:var(--g)"></i><i style="width:5px;height:5px;border-radius:3px;background:#2C3D5C"></i><i style="width:5px;height:5px;border-radius:3px;background:#2C3D5C"></i></div>`;
const art=(sz)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center">${cv(A.img,sz,sz,34,"box-shadow:0 40px 70px -20px rgba(0,0,0,.95)")}<div style="font-size:30px;font-weight:800;display:flex;align-items:center;gap:8px">${A.name} ${seal}</div>${badges}<div style="display:flex;gap:18px;align-items:center">${ring(96)}<div style="text-align:left"><b style="font-size:20px">${A.spotify}</b><div class="m" style="font-size:12px">в Spotify</div><b style="font-size:20px">${A.yt}</b><div class="m" style="font-size:12px">на YouTube</div></div></div></div>`;
V.push({t:"C · Иммерсив",s:"Размытое фото артиста — фон всего экрана, по центру объёмная обложка и кольцо Score, секции — карточки-карусель. Планшет — арт слева, секции справа; десктоп — иммерсивная панель слева и лента справа.",
phone:`<div style="position:absolute;inset:0;overflow:hidden">${blur}<div style="position:relative;padding:50px 16px 0;display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between">${back(true)}${back(true).replace("ti-arrow-left","ti-share-3")}</div>${art(200)}${actions()}${carousel(270)}</div></div>${pill}`,
tab:`<div style="position:absolute;inset:0;overflow:hidden">${blur}<div style="position:absolute;inset:0;padding:30px 30px 30px 128px;display:grid;grid-template-columns:420px 1fr;gap:28px"><div style="display:flex;flex-direction:column;gap:18px;justify-content:center">${art(260)}${actions()}${bookBtn}</div><div style="display:flex;flex-direction:column;gap:14px;overflow:hidden">${tracks(4)}${events(3)}</div></div></div>${rail}`,
