<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>DJMetry — профиль артиста</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
<style>
:root{--bg:#0B1220;--p:#121B2C;--p2:#0E1728;--line:#1F2D45;--g:#5EE6A8;--g2:#10302A;--t:#E6EEFC;--m:#9AB0D5;--o:#FFB35B;--r:#FF6B6B;--b:#7DA7FF}
*{box-sizing:border-box}body{margin:0;background:#07090f;font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--t);padding:22px}
h2{font-size:22px;margin:34px 0 4px}.sub{color:var(--m);font-size:14px;margin-bottom:14px}
.row{display:flex;gap:26px;align-items:flex-start}
.dev{position:relative;flex:none}.dev .lbl{color:var(--m);font-size:12.5px;margin-top:8px;text-align:center}
.frame{background:var(--bg);overflow:hidden;position:relative;transform-origin:top left}
.phone{width:390px;height:844px;border-radius:52px;border:10px solid #1b1d23}
.tab{width:1180px;height:820px;border-radius:40px;border:14px solid #1b1d23}
.desk{width:1440px;height:900px;border-radius:14px;border:1px solid #2a2d35}
.bar{height:34px;background:#1a1d24;display:flex;align-items:center;gap:8px;padding:0 14px}.bar i{width:12px;height:12px;border-radius:50%;display:inline-block}
.m{color:var(--m)}.g{color:var(--g)}.o{color:var(--o)}
.cv{position:relative;flex:none;overflow:hidden;background:#1A2740;border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 26px -12px rgba(0,0,0,.85)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.22),transparent 38%,transparent 60%,rgba(0,0,0,.3))}
.card{background:var(--p);border:1px solid rgba(255,255,255,.07);border-radius:22px;padding:16px}
.h{display:flex;justify-content:space-between;align-items:center;font-weight:650;font-size:15px;margin-bottom:12px}.h span{font-size:12.5px;color:var(--g);font-weight:500}
.metric{background:var(--p2);border-radius:16px;padding:12px}.metric b{display:block;font-size:22px}.metric small{color:var(--m);font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;height:50px;font-weight:650;font-size:15px}
.btn.pri{background:var(--g);color:var(--bg)}.btn.sec{background:var(--p);border:1px solid var(--line);color:var(--t)}
.tile{background:var(--p);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tile i{font-size:24px;color:var(--g)}.tile b{font-size:14.5px}.tile small{color:var(--m);font-size:12px}
.pill{position:absolute;left:18px;right:18px;bottom:26px;height:68px;border-radius:34px;background:rgba(18,27,44,.96);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-evenly}
.rail{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:76px;padding:14px 0;border-radius:38px;background:rgba(18,27,44,.96);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;gap:20px}
.pill i,.rail i{font-size:26px;color:#6F84A8}.pill .on,.rail .on{color:var(--g)}
.hash{width:56px;height:56px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:900;font-size:30px}
.badge{background:var(--r);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.st{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:8px 0;border-top:1px solid rgba(255,255,255,.05)}
.chip{font-size:12px;padding:6px 11px;border-radius:14px;background:var(--p2);color:var(--m)}
.spark{height:70px;width:100%}
.seg{display:flex;gap:6px}.seg span{padding:8px 14px;border-radius:12px;background:var(--p);color:var(--m);font-size:13.5px}.seg .on{background:var(--g);color:var(--bg);font-weight:650}
.navlist div{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-size:14.5px;color:var(--m)}.navlist div i{font-size:20px}.navlist .on{background:var(--p);color:var(--t)}.navlist .on i{color:var(--g)}
</style></head><body>
<div id="root"></div>
<script>
const A={name:"LovetechMusic",img:"https://i.scdn.co/image/ab67616100005174 9fa9bac4a3e25c98c7da3aef".replace(" ",""),score:"20.43",pos:"#1435",votes:1,followers:6,spotify:84,city:"Barcelona, ES",genres:["melodic house","melodic techno"]};
const TR=[["Elephant","ab67616d0000b2733de69e3a941af9cfd4dae9e8"],["Triad","ab67616d0000b273804af853bfe15591b99a13a5"],["Julia","ab67616d0000b273993c0a57a6cf933c590419ad"]].map(([n,i])=>({n,i:"https://i.scdn.co/image/"+i}));
const RR=[["Happier","Marshmello","ab67616d00001e02dd0a40eecd4b13e4c59988da"],["Losing It","FISHER","ab67616d00001e029367c1ee2eec0bf3a04b4868"]];
const cv=(s,w,h,r=16)=>`<div class="cv" style="width:${w}px;height:${h}px;border-radius:${r}px"><img src="${s}"></div>`;
const spark=(c="#5EE6A8")=>`<svg class="spark" viewBox="0 0 300 70" preserveAspectRatio="none"><defs><linearGradient id="gr${c.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><path d="M0 55 L30 52 L60 54 L90 45 L120 47 L150 38 L180 40 L210 30 L240 33 L270 22 L300 18 L300 70 L0 70Z" fill="url(#gr${c.slice(1)})"/><path d="M0 55 L30 52 L60 54 L90 45 L120 47 L150 38 L180 40 L210 30 L240 33 L270 22 L300 18" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/></svg>`;
const seal=`<i class="ti ti-rosette-discount-check" style="color:var(--g)"></i>`;
const pill=`<div class="pill"><i class="ti ti-trophy"></i><i class="ti ti-radar-2"></i><div class="hash">#</div><i class="ti ti-calendar-event"></i><i class="ti ti-user on"></i></div>`;
const rail=`<div class="rail"><i class="ti ti-trophy"></i><i class="ti ti-radar-2"></i><div class="hash">#</div><i class="ti ti-calendar-event"></i><i class="ti ti-user on"></i></div>`;
const status=`<div style="height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:14px;font-weight:600"><span>9:41</span><span><i class="ti ti-wifi"></i> <i class="ti ti-battery-3"></i></span></div>`;
const metrics=(cols=4)=>`<div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:10px">
 <div class="metric"><b>${A.pos}</b><small>место</small></div><div class="metric"><b class="g">${A.score}</b><small>Score</small></div>
 <div class="metric"><b>${A.votes}</b><small>голоса</small></div><div class="metric"><b>${A.followers}</b><small>подписчики</small></div></div>`;
const bookingBtn=`<div class="btn pri"><i class="ti ti-calendar-event"></i>Букинг <span class="badge" style="background:var(--bg);color:var(--g)">2</span></div>`;
const tiles=(cols=2)=>`<div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:10px">
 <div class="tile"><i class="ti ti-id-badge-2"></i><b>BIO-страница</b><small>djm.bio/lovetechmusic · 312 визитов</small></div>
 <div class="tile"><i class="ti ti-link"></i><b>Smart Links</b><small>3 ссылки · 1 240 кликов</small></div>
 <div class="tile"><i class="ti ti-chart-line"></i><b>Аналитика</b><small>+18% за 7 дней</small></div>
 <div class="tile"><i class="ti ti-radar-2"></i><b>Радары</b><small>2 новых релиза</small></div></div>`;
const booking=`<div class="card"><div class="h">Букинг · Booking Machine <span>Все заявки</span></div>
 <div class="st" style="border:0"><span class="chip" style="background:var(--g2);color:var(--g)">Завершено</span><div style="flex:1">Заявка №2 · 24 июн · ES</div><b>10 000 $</b></div>
 <div class="st"><span class="chip" style="background:var(--g2);color:var(--g)">Завершено</span><div style="flex:1">Заявка №1 · 17 июн · TR</div><b>10 000 $</b></div>
 <div class="st"><i class="ti ti-coin" style="color:var(--o)"></i><div style="flex:1" class="m">Заработок за год, после налога 13%</div><b class="o">15 660 $</b></div></div>`;
const radar=`<div class="card"><div class="h">Радары <span>Открыть</span></div>
 ${RR.map(r=>`<div class="st" style="border:0">${cv("https://i.scdn.co/image/"+r[2],40,40,10)}<div style="flex:1"><div style="font-size:14px;font-weight:600">${r[0]}</div><div class="m" style="font-size:12px">${r[1]} · Release Radar</div></div><i class="ti ti-player-play g"></i></div>`).join("")}
 <div class="st"><i class="ti ti-map-pin o" style="font-size:20px;width:40px;text-align:center"></i><div style="flex:1"><div style="font-size:14px;font-weight:600">Martin Garrix</div><div class="m" style="font-size:12px">EDC Orlando · 6 нояб · Concert Radar</div></div></div></div>`;
const scoreCard=`<div class="card"><div class="h">Score за 30 дней <span class="g">+1.8</span></div>${spark()}<div class="m" style="font-size:12px;display:flex;justify-content:space-between"><span>29 авг</span><span>сегодня</span></div></div>`;
const tracks=`<div class="card"><div class="h">Треки <span>Spotify</span></div><div style="display:flex;gap:12px">${TR.map(t=>`<div>${cv(t.i,96,96,14)}<div style="font-size:13px;margin-top:6px">${t.n}</div></div>`).join("")}</div></div>`;
const hero=(w,h)=>`<div style="position:relative;height:${h}px;border-radius:28px;overflow:hidden">
 <img src="${A.img}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
 <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,18,32,.1) 30%,rgba(11,18,32,.95))"></div>
 <div style="position:absolute;left:18px;right:18px;bottom:16px"><div style="display:flex;gap:6px">${A.genres.map(g=>`<span class="chip" style="background:rgba(255,255,255,.12);color:#fff">${g}</span>`).join("")}</div>
 <div style="font-size:30px;font-weight:780;margin-top:8px;display:flex;align-items:center;gap:8px">${A.name} ${seal}</div><div class="m" style="font-size:13px"><i class="ti ti-map-pin"></i> ${A.city} · DJMetry ${A.pos}</div></div></div>`;
function dev(kind,inner,scale,label){const W={phone:390,tab:1180,desk:1440}[kind],H={phone:844,tab:820,desk:900}[kind];const bw=kind=="phone"?20:kind=="tab"?28:2;
 return `<div class="dev" style="width:${(W+bw)*scale}px;height:${(H+bw+(kind=="desk"?34:0))*scale+24}px"><div class="frame ${kind}" style="transform:scale(${scale})">${kind=="desk"?`<div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="m" style="margin-left:10px;font-size:13px">DJMetry</span></div>`:""}${inner}</div><div class="lbl" style="position:absolute;left:0;right:0;top:${(H+bw+(kind=="desk"?34:0))*scale+4}px">${label}</div></div>`}
const V=[];
/* ─── A ─── */
V.push({t:"A · Герой и плитки",s:"Телефон — фото артиста на полэкрана, метрики и плитки сервисов; планшет — две колонки; десктоп — герой-баннер + колонка «Букинг» и «Радары».",
phone:`${status}<div style="padding:4px 16px 120px;display:flex;flex-direction:column;gap:12px;height:790px;overflow:hidden">${hero(358,300)}${metrics()}<div style="display:grid;grid-template-columns:1.2fr 1fr;gap:10px">${bookingBtn}<div class="btn sec"><i class="ti ti-external-link"></i>Страница</div></div>${tiles()}</div>${pill}`,
tab:`<div style="position:absolute;inset:0;padding:30px 30px 30px 128px;display:grid;grid-template-columns:420px 1fr;gap:24px">
 <div style="display:flex;flex-direction:column;gap:12px">${hero(420,380)}${metrics(2)}${bookingBtn}</div>
 <div style="display:flex;flex-direction:column;gap:14px">${tiles(2)}${booking}${radar}</div></div>${rail}`,
desk:`<div style="position:absolute;inset:34px 0 0 0;padding:28px 28px 28px 128px;display:grid;grid-template-columns:1fr 380px;gap:24px">
 <div style="display:flex;flex-direction:column;gap:16px"><div style="display:grid;grid-template-columns:320px 1fr;gap:18px">${hero(320,300)}<div style="display:flex;flex-direction:column;gap:14px">${metrics()}${scoreCard}</div></div>${tiles(4)}${tracks}</div>
 <div style="display:flex;flex-direction:column;gap:14px">${bookingBtn}${booking}${radar}</div></div>${rail}`});
/* ─── B ─── */
const headSmall=`<div style="display:flex;align-items:center;gap:12px">${cv(A.img,52,52,16)}<div style="flex:1"><div style="font-size:19px;font-weight:750;display:flex;gap:6px;align-items:center">${A.name} ${seal}</div><div class="m" style="font-size:12.5px">${A.pos} · Score <b class="g">${A.score}</b></div></div><div style="position:relative"><i class="ti ti-bell" style="font-size:24px"></i><span class="badge" style="position:absolute;top:-6px;right:-10px">3</span></div></div>`;
const wBooking=`<div class="card" style="background:linear-gradient(135deg,#10302A,#121B2C)"><div class="h">Букинг <span>2 заявки</span></div><div style="font-size:30px;font-weight:800" class="o">15 660 $</div><div class="m" style="font-size:12.5px">заработок за год · Booking Machine</div><div class="btn pri" style="height:42px;margin-top:12px">Открыть букинг</div></div>`;
const wLinks=`<div class="card"><div class="h">Smart Links <span>Все</span></div><div style="display:flex;gap:12px;align-items:center">${cv(TR[0].i,52,52,12)}<div style="flex:1"><b>Elephant</b><div class="m" style="font-size:12px">djm.fm/elephant · pre-save</div></div><b class="g">812</b></div>${spark("#7DA7FF")}</div>`;
const wBio=`<div class="card"><div class="h">BIO-страница <span>Редактор</span></div><div style="display:flex;gap:18px"><div><b style="font-size:24px">312</b><div class="m" style="font-size:12px">визитов</div></div><div><b style="font-size:24px">48</b><div class="m" style="font-size:12px">кликов</div></div><div><b style="font-size:24px">9</b><div class="m" style="font-size:12px">стран</div></div></div></div>`;
const wRadar=`<div class="card"><div class="h">Release Radar <span>2 новых</span></div><div style="display:flex;gap:10px">${RR.map(r=>`<div style="flex:1">${cv("https://i.scdn.co/image/"+r[2],'100%',110,14).replace("width:100%px","width:100%")}<div style="font-size:13px;margin-top:6px;font-weight:600">${r[0]}</div><div class="m" style="font-size:11.5px">${r[1]}</div></div>`).join("")}</div></div>`;
V.push({t:"B · Виджеты (бенто)",s:"Всё, чем пользуются каждый день, — виджетами: Score, букинг с заработком, Smart Links, BIO, радары. Телефон — лента виджетов; планшет — 2 колонки; десктоп — бенто-сетка.",
phone:`${status}<div style="padding:4px 16px 120px;display:flex;flex-direction:column;gap:12px;height:790px;overflow:hidden">${headSmall}${scoreCard}${wBooking}${wLinks}</div>${pill}`,
tab:`<div style="position:absolute;inset:0;padding:30px 30px 30px 128px;display:flex;flex-direction:column;gap:16px">${headSmall}
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">${scoreCard}${wBooking}${wLinks}${wBio}${wRadar}${radar}</div></div>${rail}`,
desk:`<div style="position:absolute;inset:34px 0 0 0;padding:28px 28px 28px 128px;display:flex;flex-direction:column;gap:18px">${headSmall}
 <div style="display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:auto;gap:18px">
  <div style="grid-row:span 2">${scoreCard.replace('class="spark"','class="spark" style="height:220px"')}</div>${wBooking}${wBio}${wLinks}${wRadar}</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">${tracks}${booking}</div></div>${rail}`});
/* ─── C ─── */
const secs=[["ti-layout-dashboard","Обзор"],["ti-id-badge-2","BIO-страница"],["ti-link","Smart Links"],["ti-adjustments","Ссылки по умолчанию"],["ti-chart-line","Аналитика"],["ti-calendar-event","Букинг"],["ti-radar-2","Радары"]];
const navlist=(on)=>`<div class="navlist">${secs.map(([i,n],k)=>`<div class="${k==on?"on":""}"><i class="ti ${i}"></i>${n}${n=="Букинг"?'<span class="badge" style="margin-left:auto">2</span>':""}</div>`).join("")}</div>`;
const bioEditor=`<div class="card"><div class="h">BIO-страница <span class="chip" style="background:var(--g2);color:var(--g)">Опубликовано</span></div>
 ${[["ti-photo","Шапка","фото, имя, соцсети"],["ti-brand-spotify","Spotify","Elephant, Triad, Julia"],["ti-brand-youtube","YouTube","последнее видео"],["ti-calendar","События","Bandsintown"],["ti-link","Smart Link","Elephant · pre-save"]].map(([i,a,b])=>`<div class="st"><i class="ti ti-grip-vertical m"></i><i class="ti ${i} g" style="font-size:20px"></i><div style="flex:1"><b style="font-size:14px">${a}</b><div class="m" style="font-size:12px">${b}</div></div><i class="ti ti-pencil m"></i></div>`).join("")}
 <div class="btn sec" style="height:42px;margin-top:10px"><i class="ti ti-plus"></i>Добавить блок</div></div>`;
const bioPreview=`<div style="width:300px;height:620px;border-radius:40px;border:9px solid #1b1d23;overflow:hidden;background:linear-gradient(180deg,#1b2b4a,#0B1220)"><div style="text-align:center;padding-top:40px">${cv(A.img,100,100,50).replace('class="cv"','class="cv" style="margin:0 auto;width:100px;height:100px;border-radius:50%"')}<div style="font-weight:750;font-size:20px;margin-top:10px">${A.name}</div><div class="m" style="font-size:12px">melodic house · Barcelona</div></div><div style="padding:18px;display:flex;flex-direction:column;gap:10px">${TR.map(t=>`<div style="display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.06);border-radius:14px;padding:8px">${cv(t.i,40,40,10)}<b style="font-size:13px;flex:1">${t.n}</b><i class="ti ti-player-play g"></i></div>`).join("")}<div class="btn pri" style="height:42px">Pre-save Elephant</div></div></div>`;
V.push({t:"C · Центр управления",s:"Профиль как пульт: телефон — шапка + свайп-вкладки Обзор / Музыка / Букинг / Радары; планшет — список разделов + содержимое; десктоп — три колонки: разделы, редактор (здесь — BIO), живое превью.",
phone:`${status}<div style="padding:4px 16px 120px;display:flex;flex-direction:column;gap:12px;height:790px;overflow:hidden">${headSmall}<div class="seg"><span class="on">Обзор</span><span>Музыка</span><span>Букинг</span><span>Радары</span></div>${metrics(2)}${bookingBtn}${tiles()}</div>${pill}`,
tab:`<div style="position:absolute;inset:0;padding:30px 30px 30px 128px;display:grid;grid-template-columns:280px 1fr;gap:22px"><div style="display:flex;flex-direction:column;gap:16px">${headSmall}${navlist(1)}</div><div style="display:flex;flex-direction:column;gap:14px">${bioEditor}${wBio}</div></div>${rail}`,
desk:`<div style="position:absolute;inset:34px 0 0 0;padding:28px 28px 28px 128px;display:grid;grid-template-columns:280px 1fr 340px;gap:24px"><div style="display:flex;flex-direction:column;gap:16px">${headSmall}${navlist(1)}</div><div style="display:flex;flex-direction:column;gap:16px">${bioEditor}${wBio}</div><div>${bioPreview}</div></div>${rail}`});
root.innerHTML=V.map(v=>`<h2>${v.t}</h2><div class="sub">${v.s}</div><div class="row">${dev("phone",v.phone,.62,"Телефон")}${dev("tab",v.tab,.42,"iPad альбом")}${dev("desk",v.desk,.42,"Десктоп")}</div>`).join("");
</script></body></html>
